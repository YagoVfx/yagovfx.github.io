

name: VFX Jobs Scanner

on:
  schedule:
    - cron: '0 */6 * * *'   # cada 6 horas
  workflow_dispatch:          # ejecución manual

concurrency:
  group: vfx-jobs-scanner
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scanner/requirements.txt pytest

      # Gate de calidad: si los tests unitarios fallan NO se escanea ni se sobrescriben los datos.
      - name: Run unit tests
        run: python -m pytest -q tests --ignore=tests/e2e

      - name: Run scanner
        run: python scanner/scanner.py

      - name: Refresh company registry
        run: python -m scanner.build_registry

      - name: Refresh published company locations
        run: python -m scanner.map_locations

      - name: Refresh additional mobile careers and courses
        run: python -m scanner.mobile_careers

      - name: Commit updated data if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/scanner-status.json data/scanner-report.json data/companies-registry.json data/company-locations.json data/mobile-careers.json
          if git diff --staged --quiet; then
            echo "No changes detected — skipping commit"
          else
            git commit -m "chore: update VFX jobs [automated]"
            git push
          fi


