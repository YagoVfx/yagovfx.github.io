

name: VFX Jobs Scanner

on:
  schedule:
    - cron: '0 */6 * * *'   # cada 6 horas
  workflow_dispatch:          # ejecución manual

concurrency:
  group: vfx-jobs-scanner
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scanner/requirements.txt pytest

      # Tests and generation run together on the latest main in an isolated worktree.
      # A concurrent user push triggers a fresh scan instead of rebasing stale JSON.
      - name: Test, scan and publish with concurrent-update retries
        run: python scripts/publish_scanner.py


